name: Publish Moon Tide Tarot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.TAROT_API_BASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAROT_API_BASE: ${{ vars.TAROT_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - uses: actions/configure-pages@v5
        id: pages
      - run: node scripts/verify-backend.mjs
        env:
          TAROT_FRONTEND_ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        id: artifact
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/pages
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          for attempt in {1..8}; do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.size_in_bytes > 0 and (.expired | not)' 2>/dev/null) == true ]]; then
              exit 0
            fi
            sleep 4
          done
          echo 'The uploaded Pages artifact is not available yet.' >&2
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
