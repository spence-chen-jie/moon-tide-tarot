name: Publish Moon Tide Tarot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.TAROT_API_BASE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAROT_API_BASE: ${{ vars.TAROT_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - uses: actions/configure-pages@v5
        id: pages
      - run: node scripts/verify-backend.mjs
        env:
          TAROT_FRONTEND_ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v5
        id: deployment
